<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Blitz</title>
<style>
  :root {
    --bg1: #ff6ec4;
    --bg2: #7873f5;
    --bg3: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: gradientShift 12s ease infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #game {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    color: white;
    font-weight: bold;
    font-size: 20px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 10;
    pointer-events: none;
  }
  #hud .pill {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(6px);
    padding: 8px 16px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .combo {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 10;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset -6px -6px 12px rgba(0,0,0,0.15), inset 6px 6px 12px rgba(255,255,255,0.5), 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.08s ease;
  }
  .bubble:active {
    transform: scale(0.85);
  }
  .bubble.bad {
    box-shadow: inset -6px -6px 12px rgba(0,0,0,0.3), inset 6px 6px 12px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.3);
  }
  .pop-fx {
    position: absolute;
    pointer-events: none;
    font-weight: bold;
    font-size: 22px;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    animation: popFloat 0.6s ease-out forwards;
  }
  @keyframes popFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
  }
  #startScreen, #endScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    z-index: 20;
    background: rgba(0,0,0,0.15);
  }
  #startScreen h1, #endScreen h1 {
    font-size: 52px;
    margin: 0 0 8px;
    text-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  #startScreen p, #endScreen p {
    font-size: 18px;
    max-width: 420px;
    line-height: 1.5;
    margin: 8px 0 24px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  button.playBtn {
    background: white;
    color: #7873f5;
    border: none;
    padding: 16px 40px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  button.playBtn:hover { transform: translateY(-3px) scale(1.03); }
  button.playBtn:active { transform: translateY(0) scale(0.98); }
  #endScreen { display: none; }
  .big-score {
    font-size: 72px;
    font-weight: bold;
    margin: 4px 0 0;
    text-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud" style="display:none;">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">⏱️ <span id="time">30</span>s</div>
  </div>
  <div class="combo" id="comboLabel"></div>

  <div id="startScreen">
    <h1>🫧 Bubble Blitz</h1>
    <p>Pop as many <b>colorful bubbles</b> as you can in 30 seconds!<br>
    Avoid the <b>dark spiky bubbles</b> — they cost you points.<br>
    Chain pops quickly to build a combo multiplier!</p>
    <button class="playBtn" id="playBtn">Play</button>
  </div>

  <div id="endScreen">
    <h1>Time's up!</h1>
    <p class="big-score" id="finalScore">0</p>
    <p>bubbles popped like a champ</p>
    <button class="playBtn" id="againBtn">Play Again</button>
  </div>
</div>

<script>
(function() {
  const game = document.getElementById('game');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const comboLabel = document.getElementById('comboLabel');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const playBtn = document.getElementById('playBtn');
  const againBtn = document.getElementById('againBtn');
  const finalScoreEl = document.getElementById('finalScore');

  const COLORS = [
    ['#ff6ec4', '#ff9ecb'],
    ['#5eead4', '#a7f3d0'],
    ['#facc15', '#fde68a'],
    ['#60a5fa', '#93c5fd'],
    ['#c084fc', '#e9d5ff'],
    ['#fb923c', '#fed7aa'],
  ];

  let score = 0;
  let timeLeft = 30;
  let running = false;
  let spawnTimer = null;
  let countdownTimer = null;
  let comboCount = 0;
  let comboTimeout = null;
  let bubbles = [];

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function spawnBubble() {
    if (!running) return;
    const isBad = Math.random() < 0.18;
    const size = rand(46, 86);
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isBad ? ' bad' : '');
    const gameW = game.clientWidth;
    const gameH = game.clientHeight;
    const x = rand(10, gameW - size - 10);
    const startY = gameH + size;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = x + 'px';
    bubble.style.top = startY + 'px';

    if (isBad) {
      bubble.style.background = 'radial-gradient(circle at 35% 30%, #4b5563, #111827)';
      bubble.textContent = '☠️';
      bubble.style.fontSize = (size * 0.4) + 'px';
    } else {
      const [c1, c2] = COLORS[Math.floor(Math.random() * COLORS.length)];
      bubble.style.background = `radial-gradient(circle at 35% 30%, ${c2}, ${c1})`;
    }

    game.appendChild(bubble);

    const duration = rand(3200, 5200);
    const startTime = performance.now();
    const riseDistance = gameH + size * 2;

    function animate(now) {
      if (!bubble.isConnected) return;
      const elapsed = now - startTime;
      const progress = elapsed / duration;
      if (progress >= 1) {
        bubble.remove();
        return;
      }
      const y = startY - progress * riseDistance;
      const wobble = Math.sin(elapsed / 400 + x) * 12;
      bubble.style.top = y + 'px';
      bubble.style.transform = `translateX(${wobble}px)`;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    bubble.addEventListener('click', () => popBubble(bubble, isBad, x + size / 2, parseFloat(bubble.style.top)));
    bubbles.push(bubble);
  }

  function popBubble(bubble, isBad, x, y) {
    if (!running || !bubble.isConnected) return;
    bubble.remove();

    const fx = document.createElement('div');
    fx.className = 'pop-fx';
    fx.style.left = x + 'px';
    fx.style.top = y + 'px';

    if (isBad) {
      score = Math.max(0, score - 5);
      fx.textContent = '-5';
      fx.style.color = '#f87171';
      comboCount = 0;
    } else {
      comboCount++;
      const points = 1 + Math.floor(comboCount / 5);
      score += points;
      fx.textContent = '+' + points;
      clearTimeout(comboTimeout);
      if (comboCount >= 3) {
        comboLabel.textContent = `🔥 Combo x${comboCount}!`;
        comboLabel.style.opacity = 1;
      }
      comboTimeout = setTimeout(() => {
        comboLabel.style.opacity = 0;
        comboCount = 0;
      }, 1200);
    }

    game.appendChild(fx);
    setTimeout(() => fx.remove(), 600);
    scoreEl.textContent = score;
  }

  function tick() {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      endGame();
    }
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnBubble();
    const delay = rand(380, 850);
    spawnTimer = setTimeout(scheduleSpawn, delay);
  }

  function startGame() {
    score = 0;
    timeLeft = 30;
    comboCount = 0;
    scoreEl.textContent = 0;
    timeEl.textContent = 30;
    comboLabel.style.opacity = 0;
    bubbles.forEach(b => b.remove());
    bubbles = [];
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    hud.style.display = 'flex';
    running = true;
    scheduleSpawn();
    countdownTimer = setInterval(tick, 1000);
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(countdownTimer);
    document.querySelectorAll('.bubble').forEach(b => b.remove());
    finalScoreEl.textContent = score;
    endScreen.style.display = 'flex';
    hud.style.display = 'none';
  }

  playBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
